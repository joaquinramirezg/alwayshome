# Render Blueprint for the AlwaysHome API (phase 2). In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: alwayson-api
    runtime: docker
    plan: free               # measured ~310 MB after loading all tables; fits the 512 MB free instance (sleeps when idle)
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste the key in the Render dashboard; never commit it
      - key: AI_CALLS_PER_HOUR
        value: "20"
      - key: ALLOWED_ORIGINS
        value: "*"   # the frontend calls the API through Vercel rewrites; tighten to the Vercel URL later
